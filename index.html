<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopCart — E-commerce Web Application</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="description" content="ShopCart is a responsive e-commerce web application with product search, filtering, cart, wishlist and checkout functionality.">
    <link rel="icon" href="assets/images/amazon_logo.png">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero-slider.css">
    <link rel="stylesheet" href="css/product-card.css">
    <link rel="stylesheet" href="css/slider.css">
    <link rel="stylesheet" href="css/category-section.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <div id="header"></div>

    <main>
        <!-- Existing Hero Slider -->
        <section id="heroSlider"></section>

        <!-- Shop by Category -->
        <section id="shop-categories"></section>

        <!-- Featured Products -->
        <section id="featured-products"></section>

        <!-- Promotional Banner -->
        <section id="promo-banner"></section>

        <!-- Trending Products -->
        <section id="trending-products"></section>

        <!-- Why ShopCart -->
        <section id="why-shopcart"></section>

        <!-- Newsletter -->
        <section id="newsletter"></section>

    </main>

    <div id="footer"></div>

    <script src="js/components/header.js"></script>
    <script src="js/components/heroSlider.js"></script>
    <script type="module" src="js/api/categories.js"></script>
    <script type="module" src="js/pages/home.js"></script>
    <script src="js/components/footer.js"></script>

</body>
</html>
