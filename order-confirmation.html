<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | ShopCart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="description" content="ShopCart is a responsive e-commerce web application with product search, filtering, cart, wishlist and checkout functionality.">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/orderConfirmationPage.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <div id="header"></div>

    <main class="order-confirmation-page">

        <div id="order-loading">
            Loading order details...
        </div>

        <div id="order-error" hidden></div>

        <section id="order-content" hidden>

            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>

            <h1>Order Confirmed!</h1>

            <p class="success-message">
                Thank you for your purchase.
                Your order has been placed successfully.
            </p>

            <div class="order-id-section">
                <span>Order ID</span>
                <strong id="order-id"></strong>
            </div>

            <div id="order-details">
                <!-- Generated by JavaScript -->
            </div>

            <a href="index.html" class="continue-shopping">
                Continue Shopping
            </a>

        </section>

    </main>

    <div id="footer"></div>

    <script type="module" src="js/components/header.js"></script>
    <script type="module" src="js/pages/orderConfirmationPage.js"></script>
    <script src="js/components/footer.js"></script>

</body>
</html>
